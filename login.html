<div class="auth-page">
<form class="p-5">
  <h3 class="mb-4 text-center">Log In</h3>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password">
  </div>
  <button type="button" onclick="submitLogin()" class="btn btn-submit w-100">Log In</button>
  <p class="text-center mt-3 mb-0">Don't have an account? <a href="signup.html">Sign Up</a></p>
  <h2 id="outputMessage"></h2>
</form>
</div>
<script>
function submitLogin() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let savedEmail = "alphablack@gmail.com";
    let savedPassword = "1234";

    if (email === "" || password === "") {
        document.getElementById("outputMessage").innerText = "Please fill all the fields!!";
    }
    else if (email !== savedEmail) {
        document.getElementById("outputMessage").innerText = "Email not found!";
    }
    else if (password !== savedPassword) {
        document.getElementById("outputMessage").innerText = "Incorrect password!";
    }
    else {
        document.getElementById("outputMessage").innerText = "Welcome back!";
    }
}
</script>
