<form class="adopt-form">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name">
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input type="text" class="form-control" id="phone">
    </div>
    <div class="mb-3">
      <label for="department" class="form-label">Department</label>
      <input type="text" class="form-control" id="department">
    </div>
    <div class="mb-3">
      <label for="stId" class="form-label">ID</label>
      <input type="text" class="form-control" id="stId">
    </div>
    <div class="mb-3">
        <label for="catn" class="form-label">Cat Name</label>
        <input type="text" class="form-control" id="catn">
      </div>
    <div class="mb-3">
      <label for="whyAdopt" class="form-label">Adoption Reason</label>
      <input type="text" class="form-control" id="whyAdopt">
    </div>
    <button type="button" onclick="submitForm()" class="btn btn-submit">Submit</button>
    <h2 id="outputMessage"></h2>
  </form>
  <script>
      function submitForm(){

let name = document.getElementById("name").value.trim();
let phone = document.getElementById("phone").value.trim();
let department = document.getElementById("department").value.trim();
let empId = document.getElementById("stId").value.trim();
let catn = document.getElementById("catn").value.trim();
let whyAdopt = document.getElementById("whyAdopt").value.trim();

if(name === "" || phone === "" || department === "" || empId === "" || catn === "" || whyAdopt === ""){

    document.getElementById("outputMessage").innerText =
    "Please fill all the fields!!";

    return;
}

let adoption = {
    name: name,
    phone: phone,
    department: department,
    studentId: empId,
    catName: catn,
    reason: whyAdopt
};

let adoptions = localStorage.getItem("adoptions");

if(adoptions == null){
    adoptions = [];
}else{
    adoptions = JSON.parse(adoptions);
}

adoptions.push(adoption);

localStorage.setItem("adoptions", JSON.stringify(adoptions));

document.getElementById("outputMessage").innerText =
"Application submitted successfully!";

document.getElementById("name").value = "";
document.getElementById("phone").value = "";
document.getElementById("department").value = "";
document.getElementById("stId").value = "";
document.getElementById("catn").value = "";
document.getElementById("whyAdopt").value = "";
}
  </script>
