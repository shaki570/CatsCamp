<form class="adopt-form">

    <h2 class="text-center mb-4">Donate Cats</h2>

    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name">
    </div>

    <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone">
    </div>

    <div class="mb-3">
        <label class="form-label">bKash Account Number</label>
        <div class="form-control bg-light">
            <strong>01555555555</strong>
        </div>
    </div>

    <div class="mb-3">
        <label for="accountNumber" class="form-label">
            Your bKash Account Number
        </label>
        <input type="text" class="form-control" id="accountNumber">
    </div>

    <div class="mb-3">
        <label for="amount" class="form-label">Donation Amount (৳)</label>
        <input type="number" class="form-control" id="amount">
    </div>

    <button
        type="button"
        onclick="submitForm()"
        class="btn btn-submit">

        Donate Now

    </button>

    <h2 id="outputMessage" class="mt-3 text-center"></h2>

</form>

<script>

function submitForm(){

    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let accountNumber = document.getElementById("accountNumber").value.trim();
    let amount = document.getElementById("amount").value.trim();

    if(name === "" || phone === "" || accountNumber === "" || amount === ""){

        document.getElementById("outputMessage").innerText =
        "Please fill all the fields!!";

        return;
    }

    let donation = {

        name: name,
        phone: phone,
        accountNumber: accountNumber,
        amount: amount

    };

    let donations = localStorage.getItem("donations");

    if(donations == null){

        donations = [];

    }else{

        donations = JSON.parse(donations);

    }

    donations.push(donation);

    localStorage.setItem(
        "donations",
        JSON.stringify(donations)
    );

    document.getElementById("outputMessage").innerText =
    "Thank you " + name + ", your donation has been recorded!";

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("accountNumber").value = "";
    document.getElementById("amount").value = "";

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
