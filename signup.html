<div class="auth-page">
<form class="p-5">
  <h3 class="mb-4 text-center">Sign Up</h3>
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name">
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password">
  </div>
  <div class="mb-3">
    <label for="confirmPassword" class="form-label">Confirm Password</label>
    <input type="password" class="form-control" id="confirmPassword">
  </div>
  <button type="button" onclick="submitSignup()" class="btn btn-submit w-100">Sign Up</button>
  <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Log In</a></p>
  <h2 id="outputMessage"></h2>
</form>
</div>
<script>
    function submitSignup(){
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;
 
        if (name === "" || email === "" || password === "" || confirmPassword === "") {
            document.getElementById("outputMessage").innerText = "Please fill all the fields!!";
        }
        else if (password !== confirmPassword) {
            document.getElementById("outputMessage").innerText = "Passwords do not match!!";
        }
        else {
            document.getElementById("outputMessage").innerText = "Welcome " + name + ", your account has been created!";
        }
    }
</script>
