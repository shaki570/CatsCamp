<form class="adopt-form">
    <div class="mb-3">
      <label for="name2" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="name2">
    </div>
    <div class="mb-3">
      <label for="locat" class="form-label">Cats Location</label>
      <input type="text" class="form-control" id="locat">
    </div>
    <div class="mb-3">
      <label for="problem" class="form-label">Problem</label>
      <input type="text" class="form-control" id="problem">
    </div>
    <div class="mb-3">
      <label for="desc" class="form-label">Description</label>
      <input type="text" class="form-control" id="desc">
    </div>
    <div class="mb-3">
        <label for="phn" class="form-label">Your Phone</label>
        <input type="text" class="form-control" id="phn">
      </div>
    <button type="button" onclick="submitForm()" class="btn btn-submit">Submit</button>
    <h2 id="outputMessage"></h2>
  </form>
  <script>
      function submitForm(){

let name2 = document.getElementById("name2").value.trim();
let locat = document.getElementById("locat").value.trim();
let problem = document.getElementById("problem").value.trim();
let desc = document.getElementById("desc").value.trim();
let phn = document.getElementById("phn").value.trim();

if(name2 === "" || locat === "" || problem === "" || desc === "" || phn === ""){

    document.getElementById("outputMessage").innerText =
    "Please fill all the fields!!";

    return;
}


let rescue = {
    name: name2,
    location: locat,
    problem: problem,
    description: desc,
    phone: phn
};


let rescues = localStorage.getItem("rescues");

if(rescues == null){
    rescues = [];
}
else{
    rescues = JSON.parse(rescues);
}

rescues.push(rescue);

localStorage.setItem("rescues", JSON.stringify(rescues));

document.getElementById("outputMessage").innerText =
"Thank you " + name2 + ", your rescue request has been submitted!";

document.getElementById("name2").value = "";
document.getElementById("locat").value = "";
document.getElementById("problem").value = "";
document.getElementById("desc").value = "";
document.getElementById("phn").value = "";
}
  </script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
